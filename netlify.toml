[build]
  command   = "npm run build"
  publish   = "out"

[build.environment]
  NODE_VERSION = "22"

# Lina (netlify/functions/lina, served at /api/lina). esbuild bundles the generated
# knowledge.json and the shared lib/ article index into the function.
# Secrets: set OPENAI_API_KEY in Netlify environment variables (Functions scope) — never here.
[functions]
  node_bundler = "esbuild"

# Legacy plural category → permanent singular structure (see README "Investment category URL")
# Must stay above the catch-all 404 rule.
[[redirects]]
  from   = "/library/investments/*"
  to     = "/library/investment/:splat"
  status = 301
  force  = true

# Legacy Chinese placeholder (/zh/) → Traditional Chinese pages (/zh-tw/).
# Paths with a real /zh-tw/ equivalent keep it; anything deeper (e.g. article URLs, which have
# no Chinese version) goes to the Chinese home. First match wins; :category is one segment.
# Must stay above the catch-all 404 rule.
[[redirects]]
  from   = "/zh"
  to     = "/zh-tw/"
  status = 301
  force  = true

[[redirects]]
  from   = "/zh/start"
  to     = "/zh-tw/start/"
  status = 301
  force  = true

[[redirects]]
  from   = "/zh/library"
  to     = "/zh-tw/library/"
  status = 301
  force  = true

[[redirects]]
  from   = "/zh/library/:category"
  to     = "/zh-tw/library/:category/"
  status = 301
  force  = true

[[redirects]]
  from   = "/zh/*"
  to     = "/zh-tw/"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/404"
  status = 404
